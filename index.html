<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MiniBlox Studio — Rublox</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { overflow: hidden; background: #0f172a; color: #f8fafc; user-select: none; }
    .toolbar {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92); border: 1px solid #334155;
      padding: 8px 12px; border-radius: 14px; display: flex; gap: 6px; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 10; flex-wrap: wrap; max-width: 96vw;
    }
    .toolbar-items { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .toolbar.collapsed .toolbar-items { display: none; }
    #toggleMenuBtn { display: none; background: #0284c7; }
    .btn {
      background: #334155; color: #fff; border: none; padding: 7px 10px;
      border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px;
    }
    .btn:hover { background: #475569; }
    .btn.active { outline: 2px solid #38bdf8; background: #0284c7; }
    .btn.play { background: #10b981; color: #052e16; }
    .btn.stop { background: #ef4444; color: #fff; }
    .online-badge {
      background: #064e3b; border: 1px solid #10b981; color: #6ee7b7;
      padding: 6px 10px; border-radius: 8px; font-weight: bold; font-size: 12px;
    }
    .skin-picker {
      display: flex; align-items: center; gap: 4px; background: #1e293b;
      padding: 3px 8px; border-radius: 8px; border: 1px solid #475569; font-size: 12px;
    }
    .skin-picker input { width: 22px; height: 22px; border: none; background: none; cursor: pointer; }
    .chat-box {
      position: absolute; bottom: 52px; left: 14px; width: 280px;
      background: rgba(15, 23, 42, 0.85); border: 1px solid #334155;
      border-radius: 12px; padding: 8px; z-index: 15; display: flex; flex-direction: column; gap: 6px;
    }
    .chat-messages { height: 110px; overflow-y: auto; font-size: 12px; color: #e2e8f0; display: flex; flex-direction: column; gap: 4px; word-break: break-word; }
    .chat-input-row { display: flex; gap: 6px; }
    .chat-input-row input { flex: 1; background: #0f172a; border: 1px solid #475569; color: #fff; padding: 5px 8px; border-radius: 6px; font-size: 12px; }
    .hint {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85); padding: 6px 14px; border-radius: 10px;
      font-size: 12px; color: #cbd5e1; pointer-events: none; z-index: 10;
    }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(9,13,22,0.85); z-index: 30; align-items: center; justify-content: center; }
    .modal-card { background: #1e293b; border: 1px solid #475569; border-radius: 16px; padding: 18px; width: 90%; max-width: 460px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; color: #38bdf8; }
    .games-list { display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; }
    .modal-footer { margin-top: 12px; border-top: 1px solid #334155; padding-top: 10px; display: flex; gap: 8px; }
    .modal-footer input { flex: 1; padding: 7px 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; }
    #rotate-warning, #mobile-controls { display: none; }

    @media (max-width: 850px) and (orientation: portrait) {
      #rotate-warning {
        display: flex; position: fixed; inset: 0; z-index: 9999; background: rgba(15, 23, 42, 0.95);
        align-items: center; justify-content: center; text-align: center; padding: 20px;
      }
      .rotate-box button { margin-top: 12px; }
    }
    @media (max-height: 520px) and (orientation: landscape), (pointer: coarse) {
      #toggleMenuBtn { display: inline-block; }
      .hint { display: none; }
      .toolbar { left: 8px; top: 8px; transform: none; max-width: 60vw; max-height: 58vh; overflow-y: auto; padding: 5px; }
      .toolbar button { padding: 4px 6px; font-size: 11px; }
      .chat-box { top: 8px; right: 8px; left: auto; bottom: auto; width: 200px; padding: 5px; opacity: 0.85; }
      .chat-messages { height: 60px; font-size: 11px; }
      #mobile-controls {
        display: flex; justify-content: space-between; align-items: flex-end;
        position: fixed; bottom: 12px; left: 16px; right: 16px; pointer-events: none; z-index: 25;
      }
      #mobile-controls button {
        pointer-events: auto; width: 44px; height: 44px; font-size: 18px;
        background: rgba(15, 23, 42, 0.6); color: #fff; border: 1px solid rgba(255,255,255,0.35);
        border-radius: 12px; touch-action: manipulation;
      }
      .dpad { display: flex; flex-direction: column; align-items: center; gap: 4px; }
      .dpad-row { display: flex; gap: 4px; }
      #btn-jump { width: 56px !important; height: 56px !important; border-radius: 50% !important; font-size: 22px; }
    }
  </style>
</head>
<body>

  <!-- 1. ИНТЕРФЕЙС И КНОПКИ -->
  <div id="rotate-warning">
    <div class="rotate-box">
      <div style="font-size:44px;">📱🔄</div>
      <h3>Поверни телефон горизонтально</h3>
      <p>Так экран станет широким, а кнопки удобно лягут под пальцы!</p>
      <button class="btn" onclick="document.getElementById('rotate-warning').style.display='none'">Играть так</button>
    </div>
  </div>

  <div class="toolbar" id="toolbar">
    <span id="onlineCounter" class="online-badge">🟢 Онлайн: 1</span>
    <button id="modeBtn" class="btn play" onclick="toggleMode()">▶ Play (Играть)</button>
    <button id="toggleMenuBtn" class="btn" onclick="document.getElementById('toolbar').classList.toggle('collapsed')">🔽 Меню</button>

    <div class="toolbar-items" id="toolbarItems">
      <button id="t-block" class="btn active" onclick="selectTool('block')">🟦 Блок</button>
      <button id="t-lava" class="btn" onclick="selectTool('lava')">🟥 Лава</button>
      <button id="t-jump" class="btn" onclick="selectTool('jump')">🟩 Батут</button>
      <button id="t-win" class="btn" onclick="selectTool('win')">🟨 Финиш</button>
      <button id="t-del" class="btn" onclick="selectTool('del')">🗑️ Удалить</button>
      <button class="btn" style="background:#8b5cf6;" onclick="toggleCatalog()">🌐 Игры игроков</button>
      <button class="btn" style="background:#059669;" onclick="hostOnlineRoom()">📡 Создать комнату</button>
      <button class="btn" style="background:#2563eb;" onclick="joinOnlineRoom()">🔗 Войти к другу</button>
      <button class="btn" style="background:#0284c7;" onclick="shareMapCode()">📤 Код карты</button>
      <button class="btn" style="background:#0284c7;" onclick="importMapCode()">📥 Вставить код</button>
      <button class="btn" onclick="clearMap()">🧹 Очистить</button>
      <div class="skin-picker">
        <span>👕</span>
        <input type="color" id="shirtColor" value="#0284c7" onchange="updateSkinColor()">
        <span>👖</span>
        <input type="color" id="pantsColor" value="#16a34a" onchange="updateSkinColor()">
      </div>
    </div>
  </div>

  <div id="catalogModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h2>🌐 Игры сообщества Rublox</h2>
        <button class="btn stop" onclick="toggleCatalog()">✖</button>
      </div>
      <div id="gamesList" class="games-list"></div>
      <div class="modal-footer">
        <input id="newGameTitle" type="text" placeholder="Название твоей игры...">
        <button class="btn play" onclick="publishCurrentMap()">Опубликовать</button>
      </div>
    </div>
  </div>

  <div class="chat-box">
    <div class="chat-messages" id="chatMessages">
      <div style="color:#38bdf8;">💬 <b>Чат комнаты готов!</b> Нажми Enter, чтобы написать.</div>
    </div>
    <div class="chat-input-row">
      <input id="chatInput" type="text" placeholder="Написать в чат..." maxlength="80" onkeydown="if(event.key==='Enter') sendChatMessage()">
      <button class="btn play" onclick="sendChatMessage()">➤</button>
    </div>
  </div>

  <div class="hint" id="hintText">Режим Studio: <b>ЛКМ</b> — поставить блок | <b>ПКМ + мышь</b> — вращать камеру</div>

  <div id="mobile-controls">
    <div class="dpad">
      <button id="btn-up">▲</button>
      <div class="dpad-row">
        <button id="btn-left">◀</button>
        <button id="btn-down">▼</button>
        <button id="btn-right">▶</button>
      </div>
    </div>
    <button id="btn-jump">⬆</button>
  </div>

  <script src="three.min.js"></script>
  <script>
    // ================= 2. 3D-СЦЕНА, ОБЛАКА И КАМЕРА =================
    const DB_URL = "https://" + "bloxag-default-rtdb." + "firebaseio.com";
    const myPlayerId = "p_" + Math.random().toString(36).slice(2, 10);
    let currentRoomId = "lobby";
    let isPlayMode = false;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x38bdf8);
    scene.fog = new THREE.Fog(0x38bdf8, 25, 85);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 150);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const sun = new THREE.DirectionalLight(0xffffff, 1.3);
    sun.position.set(15, 25, 15);
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0xffffff, 0.65));

    const baseplate = new THREE.Mesh(
      new THREE.BoxGeometry(40, 1, 40),
      new THREE.MeshStandardMaterial({ color: 0x475569 })
    );
    baseplate.position.y = -0.5;
    baseplate.userData.isBase = true;
    scene.add(baseplate);
    scene.add(new THREE.GridHelper(40, 40, 0x94a3b8, 0x334155));

    for (let i = 0; i < 12; i++) {
      const cloud = new THREE.Mesh(
Используйте код с осторожностью.
new THREE.BoxGeometry(4 + Math.random() * 4, 1, 3 + Math.random() * 3),
new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 })
);
cloud.position.set((Math.random() - 0.5) * 70, 14 + Math.random() * 6, (Math.random() - 0.5) * 70);
scene.add(cloud);
}
let camYaw = 0, camPitch = 0.45, isRotating = false, prevX = 0, prevY = 0;
window.addEventListener("contextmenu", e => e.preventDefault());
renderer.domElement.addEventListener("mousedown", e => {
if (e.button === 2 || isPlayMode) { isRotating = true; prevX = e.clientX; prevY = e.clientY; }
});
window.addEventListener("mouseup", () => isRotating = false);
window.addEventListener("mousemove", e => {
if (!isRotating) return;
camYaw -= (e.clientX - prevX) * 0.007;
camPitch = Math.max(0.1, Math.min(1.3, camPitch + (e.clientY - prevY) * 0.007));
prevX = e.clientX; prevY = e.clientY;
});
renderer.domElement.addEventListener("touchstart", e => {
if (e.touches.length === 1) { isRotating = true; prevX = e.touches[0].clientX; prevY = e.touches[0].clientY; }
}, { passive: true });
renderer.domElement.addEventListener("touchmove", e => {
if (!isRotating || e.touches.length !== 1) return;
camYaw -= (e.touches[0].clientX - prevX) * 0.008;
camPitch = Math.max(0.1, Math.min(1.3, camPitch + (e.touches[0].clientY - prevY) * 0.008));
prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
}, { passive: true });
renderer.domElement.addEventListener("touchend", () => isRotating = false);
window.addEventListener("resize", () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});
// ================= 3. ПЕРСОНАЖ, СКИНЫ И КНОПКИ ТЕЛЕФОНА =================
function createAvatar(shirtHex = "#0284c7", pantsHex = "#16a34a") {
const group = new THREE.Group();
const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshStandardMaterial({ color: 0xfacc15 }));
head.position.y = 1.65;
const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.85, 0.4), new THREE.MeshStandardMaterial({ color: shirtHex }));
torso.position.y = 0.95;
const legs = new THREE.Mesh(new THREE.BoxGeometry(0.76, 0.75, 0.38), new THREE.MeshStandardMaterial({ color: pantsHex }));
legs.position.y = 0.375;
const armL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.8, 0.3), new THREE.MeshStandardMaterial({ color: 0xfacc15 }));
armL.position.set(-0.58, 0.95, 0);
const armR = armL.clone();
armR.position.x = 0.58;
group.add(head, torso, legs, armL, armR);
group.userData = { torso, legs };
return group;
}
const player = createAvatar();
player.position.set(0, 0, 5);
scene.add(player);
const friendAvatar = createAvatar("#ef4444", "#16a34a");
friendAvatar.visible = false;
scene.add(friendAvatar);
function updateSkinColor() {
player.userData.torso.material.color.set(document.getElementById("shirtColor").value);
player.userData.legs.material.color.set(document.getElementById("pantsColor").value);
}
const keys = {};
window.addEventListener("keydown", e => {
if (document.activeElement.tagName === "INPUT") return;
keys[e.code] = true;
});
window.addEventListener("keyup", e => keys[e.code] = false);
function bindMobileBtn(id, code) {
const el = document.getElementById(id);
if (!el) return;
el.addEventListener("touchstart", e => { e.preventDefault(); keys[code] = true; });
el.addEventListener("touchend", e => { e.preventDefault(); keys[code] = false; });
}
bindMobileBtn("btn-up", "KeyW");
bindMobileBtn("btn-down", "KeyS");
bindMobileBtn("btn-left", "KeyA");
bindMobileBtn("btn-right", "KeyD");
bindMobileBtn("btn-jump", "Space");
let velY = 0, onGround = false;
function respawnPlayer() {
player.position.set(0, 1, 5);
velY = 0;
}
function toggleMode() {
isPlayMode = !isPlayMode;
const btn = document.getElementById("modeBtn");
const hint = document.getElementById("hintText");
if (isPlayMode) {
btn.textContent = "⏹ Stop (В Studio)";
btn.className = "btn stop";
hint.innerHTML = "Режим игры: WASD — бег | Пробел — прыжок | Мышь — камера";
respawnPlayer();
} else {
btn.textContent = "▶ Play (Играть)";
btn.className = "btn play";
hint.innerHTML = "Режим Studio: ЛКМ — поставить блок | ПКМ + мышь — вращать камеру";
}
}
// ================= 4. СТРОИТЕЛЬ КАРТ И НЕОНОВЫЕ БЛОКИ =================
let currentTool = "block";
const blocks = [];
const BLOCK_COLORS = { block: 0x0284c7, lava: 0xef4444, jump: 0x22c55e, win: 0xfacc15 };
function selectTool(tool) {
currentTool = tool;
document.querySelectorAll(".toolbar-items .btn").forEach(b => b.classList.remove("active"));
const el = document.getElementById("t-" + tool);
if (el) el.classList.add("active");
}
function addBlockAt(x, y, z, type = "block") {
const geo = new THREE.BoxGeometry(1, 1, 1);
const mat = new THREE.MeshStandardMaterial({ color: BLOCK_COLORS[type] || 0x0284c7 });
const mesh = new THREE.Mesh(geo, mat);
mesh.position.set(x, y, z);
mesh.userData = { isBlock: true, type };
const edges = new THREE.LineSegments(
new THREE.EdgesGeometry(geo),
new THREE.LineBasicMaterial({ color: 0x00ffff })
);
mesh.add(edges);
scene.add(mesh);
blocks.push(mesh);
}
function clearMap() {
blocks.forEach(b => scene.remove(b));
blocks.length = 0;
}
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
renderer.domElement.addEventListener("pointerdown", e => {
if (isPlayMode || e.button !== 0) return;
mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
raycaster.setFromCamera(mouse, camera);
const hits = raycaster.intersectObjects([baseplate, ...blocks]);
if (!hits.length) return;
const hit = hits[0];
if (currentTool === "delete" || currentTool === "del") {
if (hit.object.userData.isBlock) {
scene.remove(hit.object);
const idx = blocks.indexOf(hit.object);
if (idx > -1) blocks.splice(idx, 1);
}
return;
}
const pos = hit.point.clone().add(hit.face.normal.clone().multiplyScalar(0.5));
addBlockAt(Math.round(pos.x), Math.max(0.5, Math.floor(pos.y) + 0.5), Math.round(pos.z), currentTool);
});
function getMapData() {
return blocks.map(b => ({ x: b.position.x, y: b.position.y, z: b.position.z, t: b.userData.type }));
}
function loadMapData(arr) {
clearMap();
(arr || []).forEach(d => addBlockAt(d.x, d.y, d.z, d.t));
}
function shareMapCode() {
prompt("Скопируй код своей карты:", JSON.stringify(getMapData()));
}
function importMapCode() {
const raw = prompt("Вставь код карты:");
if (!raw) return;
try { loadMapData(JSON.parse(raw)); } catch { alert("Неверный код карты"); }
}
function toggleCatalog() {
const m = document.getElementById("catalogModal");
m.style.display = m.style.display === "flex" ? "none" : "flex";
if (m.style.display === "flex") loadCommunityMaps();
}
async function publishCurrentMap() {
const title = document.getElementById("newGameTitle").value.trim() || "Паркур без названия";
await fetch(${DB_URL}/maps.json, {
method: "POST",
body: JSON.stringify({ title, blocks: getMapData(), createdAt: Date.now() })
});
document.getElementById("newGameTitle").value = "";
loadCommunityMaps();
}
async function loadCommunityMaps() {
const list = document.getElementById("gamesList");
list.innerHTML = "Загрузка...";
const res = await fetch(${DB_URL}/maps.json);
const data = await res.json();
list.innerHTML = "";
if (!data) { list.innerHTML = "Пока нет опубликованных карт."; return; }
Object.values(data).reverse().forEach(item => {
const row = document.createElement("div");
row.style.cssText = "display:flex;justify-content:space-between;align-items:center;background:#0f172a;padding:8px 12px;border-radius:8px;";
row.innerHTML = <span>🎮 <b>${item.title}</b> (${(item.blocks || []).length} бл.)</span>;
const playBtn = document.createElement("button");
playBtn.className = "btn play";
playBtn.textContent = "Играть";
playBtn.onclick = () => { loadMapData(item.blocks); toggleCatalog(); if (!isPlayMode) toggleMode(); };
row.appendChild(playBtn);
list.appendChild(row);
});
}
// ================= 5. МУЛЬТИПЛЕЕР, ЧАТ И ЦИКЛ 60 FPS =================
function hostOnlineRoom() {
currentRoomId = "room_" + Math.floor(1000 + Math.random() * 9000);
alert("Комната создана! Код для друга: " + currentRoomId);
}
function joinOnlineRoom() {
const code = prompt("Введи код комнаты друга:");
if (code) currentRoomId = code.trim();
}
async function sendChatMessage() {
const inp = document.getElementById("chatInput");
const text = inp.value.trim();
if (!text) return;
inp.value = "";
await fetch(${DB_URL}/rooms/${currentRoomId}/chat.json, {
method: "POST",
body: JSON.stringify({ sender: myPlayerId.slice(0, 6), text, ts: Date.now() })
});
}
let lastChatCount = 0;
async function syncNetwork() {
try {
await fetch(${DB_URL}/rooms/${currentRoomId}/players/${myPlayerId}.json, {
method: "PUT",
body: JSON.stringify({
x: +player.position.x.toFixed(2),
y: +player.position.y.toFixed(2),
z: +player.position.z.toFixed(2),
ry: +player.rotation.y.toFixed(2),
shirt: document.getElementById("shirtColor").value,
pants: document.getElementById("pantsColor").value,
ts: Date.now()
})
});
const pRes = await fetch(${DB_URL}/rooms/${currentRoomId}/players.json);
const players = (await pRes.json()) || {};
const now = Date.now();
const active = Object.entries(players).filter(([, v]) => now - v.ts < 8000);
document.getElementById("onlineCounter").textContent = "🟢 Онлайн: " + Math.max(1, active.length);
const other = active.find(([id]) => id !== myPlayerId);
if (other) {
const pData = other[1];
friendAvatar.visible = true;
if (pData.shirt) friendAvatar.userData.torso.material.color.set(pData.shirt);
if (pData.pants) friendAvatar.userData.legs.material.color.set(pData.pants);
if (friendAvatar.userData.targetX === undefined) {
friendAvatar.position.set(pData.x, pData.y, pData.z);
}
friendAvatar.userData.targetX = pData.x;
friendAvatar.userData.targetY = pData.y;
friendAvatar.userData.targetZ = pData.z;
friendAvatar.userData.targetRy = pData.ry;
} else {
friendAvatar.visible = false;
}
const cRes = await fetch(${DB_URL}/rooms/${currentRoomId}/chat.json);
const chatData = await cRes.json();
if (chatData) {
const msgs = Object.values(chatData).slice(-15);
if (msgs.length !== lastChatCount) {
lastChatCount = msgs.length;
const box = document.getElementById("chatMessages");
box.innerHTML = msgs.map(m => <div><b>[${m.sender}]:</b> ${m.text}</div>).join("");
box.scrollTop = box.scrollHeight;
}
}
} catch (e) {}
}
setInterval(syncNetwork, 350);
function animate() {
requestAnimationFrame(animate);
const speed = 0.13;
let moveX = 0, moveZ = 0;
if (keys["KeyW"] || keys["ArrowUp"]) moveZ -= 1;
if (keys["KeyS"] || keys["ArrowDown"]) moveZ += 1;
if (keys["KeyA"] || keys["ArrowLeft"]) moveX -= 1;
if (keys["KeyD"] || keys["ArrowRight"]) moveX += 1;
if (moveX || moveZ) {
const angle = Math.atan2(moveX, moveZ) + camYaw;
player.position.x += Math.sin(angle) * speed;
player.position.z += Math.cos(angle) * speed;
player.rotation.y = angle;
}
if (keys["Space"] && onGround) { velY = 0.24; onGround = false; }
velY -= 0.012;
player.position.y += velY;
onGround = false;
if (player.position.y <= 0 && Math.abs(player.position.x) <= 20 && Math.abs(player.position.z) <= 20) {
player.position.y = 0; velY = 0; onGround = true;
}
for (const b of blocks) {
if (Math.abs(player.position.x - b.position.x) < 0.75 && Math.abs(player.position.z - b.position.z) < 0.75) {
const top = b.position.y + 0.5;
if (player.position.y <= top && player.position.y >= top - 0.4 && velY <= 0) {
if (b.userData.type === "lava") { respawnPlayer(); break; }
